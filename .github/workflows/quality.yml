name: Code Quality — Checkstyle & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Checkstyle, PMD CPD, JaCoCo & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install cloc (métriques volume LOC / commentaires)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cloc

      - name: cloc sur les sources Java principales
        run: cloc src/main/java --include-lang=Java

      - name: Build, run tests & generate reports
        run: mvn -B clean verify

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload PMD CPD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-cpd-report
          path: target/cpd.xml
